<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Threat Intel</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 380px; }
    header { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border-muted); background: #010409; }
    header img { width: 20px; height: 20px; }
    header b { flex: 1; font-size: 13px; }
    header a { color: var(--muted); font-size: 12px; }
    main { padding: 12px 14px 14px; }
    .verdict { display: flex; gap: 12px; align-items: center; }
    .score { font-size: 34px; font-weight: 700; color: var(--c); min-width: 70px; text-align: center; line-height: 1; }
    .score small { display: block; font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 4px; }
    .host { font-size: 13px; margin-top: 4px; word-break: break-all; }
    .bar { height: 5px; border-radius: 3px; background: var(--border-muted); margin: 10px 0 2px; overflow: hidden; }
    .bar div { height: 100%; background: var(--c); }
    ul { margin: 4px 0 0; padding-left: 16px; }
    li { margin: 2px 0; }
    .factor { display: flex; gap: 8px; padding: 3px 0; border-bottom: 1px solid var(--border-muted); }
    .factor:last-child { border-bottom: 0; }
    .factor b { min-width: 30px; text-align: right; color: var(--c); }
    .factor b.neg { color: #3fb950; }
    .changes { margin-top: 10px; padding: 8px 10px; border: 1px solid rgba(47,129,247,.4); background: rgba(47,129,247,.08); border-radius: 6px; }
    .override { margin-top: 8px; padding: 6px 10px; border: 1px solid rgba(163,113,247,.4); background: rgba(163,113,247,.08); border-radius: 6px; color: #d2a8ff; }
    .row { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .row .btn { flex: 1; }
    .note { margin-top: 8px; }
    .state { text-align: center; padding: 26px 10px; color: var(--muted); }
    .state b { display: block; color: var(--text); font-size: 14px; margin-bottom: 6px; }
    code { background: var(--surface-2); padding: 1px 5px; border-radius: 4px; color: var(--text); }
    footer { padding: 8px 14px; border-top: 1px solid var(--border-muted); color: var(--subtle); font-size: 11px; display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <b>Threat Intel</b>
    <a href="#" id="open-options">Settings</a>
  </header>
  <main id="main"><div class="state">Loading…</div></main>
  <footer><span id="foot-left"></span><a href="#" id="open-app">Open app ↗</a></footer>
  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
